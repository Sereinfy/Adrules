name: Update Rules
on:
  schedule:
  - cron: '0 */6 * * *'
  push:
    paths:
    - 'script/*'
    - 'mod/*'
    - 'index.html'
    - '.github/workflows/*'

  workflow_dispatch:

  repository_dispatch:
    types:
    - Manual-Update

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Update Upstream
      continue-on-error: false
      run: |
        pip install requests
        bash ./script/update_upstream.sh
        tar -czvf archive.tar.gz ./tmp/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: archive.tar.gz
        path: archive.tar.gz

    - name: Build Rules
      continue-on-error: false
      run: |
        bash ./script/update_content.sh
        bash ./script/update_dns.sh
        rm -f archive.tar.gz

    - name: Git push assets to Github
      run: |
        git init
        git config --local user.name "actions"
        git config --local user.email "action@github.com"
        git checkout --orphan main
        git rm -rf .github
        git rm -rf script
        git rm -rf *.md
        git rm -rf LICENSE
        git add *.{conf,txt,list,html,json,srs,mrs} mod/*
        git commit -m "Update at $(TZ=UTC-8 date +"%Y-%m-%d %H:%M")"
        git push -f -u origin main

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 2
        keep_minimum_runs: 5
